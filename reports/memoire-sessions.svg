<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 656" width="960" height="656" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Mémoire de Kenshi pendant les sessions enregistrées</title><desc id="d">Mémoire privée du jeu et RAM libre du système, toutes les 5 s, pour trois sessions. Les trois sessions montent à environ 8 Go de mémoire privée en moins de 2 minutes ; la RAM libre tombe sous 1 Go, et jusqu&apos;à 58 Mo pendant la session de 22 minutes.</desc>
<rect width="960" height="656" rx="8" fill="#fcfcfb"/>
<text x="24" y="38" font-size="19" font-weight="600" fill="#0b0b0b">Mémoire de Kenshi pendant les sessions enregistrées</text>
<text x="24" y="62" font-size="13" fill="#52514e">Mesures du moniteur de session toutes les 5 s, depuis le lancement du jeu. PC : 16 Go de RAM.</text>
